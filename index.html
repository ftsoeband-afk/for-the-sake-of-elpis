<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="for the sake of Elpis — Tokyo Alternative / Nu Metal">
  <meta property="og:title" content="for the sake of Elpis">
  <meta property="og:description" content="Tokyo / Alternative / Nu Metal">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <title>for the sake of Elpis</title>
</head>

<body>
  <!--
    The intro represents two states/personas briefly out of sync,
    then resolving into one signal.
  -->
  <div class="boot" aria-hidden="true">
    <div class="boot-mark">
      <span class="boot-mark__small"></span>
      <span class="boot-mark__large"></span>
    </div>
    <p class="boot-text">MEMORY LINK / INITIALIZING<span class="dots"></span></p>
  </div>

  <div class="noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="signal" aria-hidden="true"></div>

  <main class="site-shell">
    <img class="watermark" src="assets/logo.png" alt="" aria-hidden="true">

    <section class="hero">
      <div class="hero__inner">
        <p class="eyebrow reveal" style="--delay: 1.10s">TOKYO / ALTERNATIVE / NU METAL</p>

        <h1 class="title reveal" style="--delay: 1.25s">
          <span>for the sake of</span>
          <em>Elpis</em>
        </h1>

        <div class="rule reveal" style="--delay: 1.50s"></div>

        <p class="location reveal" style="--delay: 1.62s">
          東京　オルタナティブ・ニューメタル
        </p>

        <nav class="socials reveal" style="--delay: 1.78s" aria-label="Social links">
          <!-- Replace the # links below with the band's actual URLs. -->
          <a href="https://x.com/F_T_S_O_Elpis" class="social" aria-label="X">
            <i class="bi bi-twitter-x" aria-hidden="true"></i>
          </a>
          <a href="https://www.instagram.com/ftsoeband/" class="social" aria-label="Instagram">
            <i class="bi bi-instagram" aria-hidden="true"></i>
          </a>
        </nav>

        <div class="contact reveal" style="--delay: 1.92s">
          <p class="contact__label">CONTACT</p>
          <a class="contact__mail" href="mailto:ftsoeband@gmail.com">
            ftsoeband@gmail.com
          </a>
        </div>
      </div>
    </section>

    <footer class="footer reveal" style="--delay: 2.05s">
      <span>FTSOE / 2026</span>
      <span>© for the sake of Elpis</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
